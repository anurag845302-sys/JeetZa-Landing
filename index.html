<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jeetza · Play & Win Big</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
      background: #0a0a0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background-image: radial-gradient(circle at 20% 30%, rgba(255, 200, 0, 0.08), transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(0, 255, 120, 0.06), transparent 50%);
    }

    .container {
      max-width: 420px;
      width: 100%;
      background: linear-gradient(145deg, #14141f, #1a1a2a);
      border-radius: 32px;
      padding: 28px 20px 24px;
      border: 1px solid rgba(255, 215, 0, 0.25);
      box-shadow: 0 0 60px rgba(255, 200, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* 顶部光晕 */
    .container::before {
      content: '';
      position: absolute;
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.3), transparent 70%);
      filter: blur(40px);
      pointer-events: none;
    }

    /* 金币浮动装饰（CSS 模拟） */
    .coin-float {
      position: absolute;
      font-size: 36px;
      opacity: 0.15;
      pointer-events: none;
      animation: float 6s ease-in-out infinite;
    }
    .coin-1 { top: 10%; left: 5%; animation-delay: 0s; }
    .coin-2 { top: 20%; right: 8%; animation-delay: 1.5s; font-size: 28px; }
    .coin-3 { bottom: 30%; left: 10%; animation-delay: 3s; font-size: 24px; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(10deg); }
    }

    /* 头部标签 */
    .hot-tag {
      display: inline-block;
      background: linear-gradient(90deg, #ff4d4d, #ff8c00);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 6px 16px;
      border-radius: 50px;
      text-transform: uppercase;
      margin-bottom: 16px;
      box-shadow: 0 0 20px rgba(255, 77, 77, 0.5);
    }

    .logo-text {
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(180deg, #ffe066, #ffb800, #cc8800);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 40px rgba(255, 200, 0, 0.3);
      margin-bottom: 4px;
      position: relative;
      z-index: 1;
    }

    .sub-headline {
      font-size: 15px;
      color: #aaa;
      letter-spacing: 0.5px;
      margin-bottom: 24px;
    }

    .sub-headline span {
      color: #00e676;
      font-weight: 600;
    }

    /* 中奖横幅 */
    .win-banner {
      background: linear-gradient(90deg, rgba(0, 230, 118, 0.15), rgba(255, 215, 0, 0.15));
      border: 1px solid rgba(0, 230, 118, 0.3);
      border-radius: 16px;
      padding: 14px 12px;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      color: #ccc;
      position: relative;
      z-index: 1;
    }

    .win-banner .green {
      color: #00e676;
      font-weight: 700;
      font-size: 16px;
    }

    .win-banner .icon {
      font-size: 22px;
    }

    /* 游戏图标行 */
    .game-icons {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-bottom: 26px;
      font-size: 32px;
      filter: drop-shadow(0 0 12px rgba(255, 200, 0, 0.3));
    }

    .game-icons span {
      animation: pulse 2.5s ease-in-out infinite;
    }
    .game-icons span:nth-child(2) { animation-delay: 0.3s; }
    .game-icons span:nth-child(3) { animation-delay: 0.6s; }
    .game-icons span:nth-child(4) { animation-delay: 0.9s; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    /* 主 CTA 按钮 */
    .cta-btn {
      display: block;
      width: 100%;
      background: linear-gradient(180deg, #00e676, #00b85c);
      color: #0a0a0f;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 18px 20px;
      border-radius: 60px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 0 #008a44, 0 12px 30px rgba(0, 230, 118, 0.35);
      transition: all 0.1s ease;
      position: relative;
      z-index: 1;
      margin-bottom: 14px;
    }

    .cta-btn:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #008a44, 0 6px 20px rgba(0, 230, 118, 0.3);
    }

    .cta-sub {
      font-size: 12px;
      color: #666;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .cta-sub .dot {
      width: 4px;
      height: 4px;
      background: #555;
      border-radius: 50%;
    }

    /* 信任/特色行 */
    .features {
      display: flex;
      justify-content: space-around;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 18px;
      gap: 8px;
    }

    .feature-item {
      text-align: center;
      flex: 1;
    }

    .feature-item .emoji {
      font-size: 22px;
      display: block;
      margin-bottom: 4px;
    }

    .feature-item .label {
      font-size: 10px;
      color: #888;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    /* 底部小字 */
    .footer-note {
      margin-top: 18px;
      font-size: 9px;
      color: #3a3a4a;
      line-height: 1.4;
    }

    /* 底部微光条 */
    .glow-bar {
      height: 2px;
      background: linear-gradient(90deg, transparent, #ffd700, #00e676, transparent);
      border-radius: 4px;
      margin-top: 18px;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 装饰 -->
    <div class="coin-float coin-1">🪙</div>
    <div class="coin-float coin-2">💰</div>
    <div class="coin-float coin-3">🎰</div>

    <div class="hot-tag">🔥 Most Popular</div>

    <div class="logo-text">JEETZA</div>
    <div class="sub-headline">Play Slots · Win <span>Real Rewards</span></div>

    <!-- 中奖横幅 -->
    <div class="win-banner">
      <span class="icon">🎉</span>
      <span>Someone just won <span class="green">₹12,500</span></span>
      <span class="icon">🎉</span>
    </div>

    <!-- 游戏图标 -->
    <div class="game-icons">
      <span>🎰</span>
      <span>🃏</span>
      <span>💎</span>
      <span>🎲</span>
    </div>

    <!-- 主按钮 → 跳转目标 -->
    <a 
      href="https://jeetza.icu/h5/index.html?channelId=100006" 
      class="cta-btn"
      target="_blank" 
      rel="noopener noreferrer"
    >
      ⚡ Start Winning Now
    </a>

    <div class="cta-sub">
      <span>No download needed</span>
      <span class="dot"></span>
      <span>Instant play</span>
    </div>

    <!-- 特色行 -->
    <div class="features">
      <div class="feature-item">
        <span class="emoji">🔒</span>
        <span class="label">Secure</span>
      </div>
      <div class="feature-item">
        <span class="emoji">⚡</span>
        <span class="label">Fast Payout</span>
      </div>
      <div class="feature-item">
        <span class="emoji">🎁</span>
        <span class="label">Daily Bonus</span>
      </div>
      <div class="feature-item">
        <span class="emoji">📱</span>
        <span class="label">Mobile First</span>
      </div>
    </div>

    <div class="glow-bar"></div>

    <div class="footer-note">
      18+ only. Play responsibly.<br>
      This page is for promotional purposes.
    </div>
  </div>

</body>
</html>
