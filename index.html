<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khelo5 - Instant Withdraw Casino</title>
    <style>
        /* Base Reset & Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0a0e17; /* Dark casino background */
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Header / Banner Area */
        .hero-section {
            width: 100%;
            max-width: 600px;
            background: linear-gradient(135deg, #1e2a44, #0a0e17);
            padding: 40px 20px;
            text-align: center;
            border-bottom: 2px solid #2a3a5a;
            position: relative;
            overflow: hidden;
        }

        /* Fake background glow effect */
        .hero-section::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 150, 255, 0.1) 0%, transparent 60%);
            z-index: 0;
        }

        .logo {
            font-size: 36px;
            font-weight: 900;
            color: #ffd700; /* Gold color */
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .tagline {
            font-size: 16px;
            color: #a0b0c0;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        /* Referral Code Box */
        .referral-box {
            background-color: #151c2c;
            border: 1px dashed #4a6a9a;
            padding: 10px 20px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        .referral-label {
            font-size: 12px;
            color: #a0b0c0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .referral-code {
            font-size: 20px;
            font-weight: bold;
            color: #00ffcc; /* Neon cyan */
            letter-spacing: 2px;
        }

        /* Action Buttons */
        .action-area {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 90%;
            max-width: 400px;
            margin-top: 30px;
            z-index: 1;
            position: relative;
        }

        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(90deg, #ff8c00, #ff4500);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 69, 0, 0.4);
        }

        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(255, 69, 0, 0.6);
        }

        .btn-secondary {
            background-color: #1e2a44;
            color: #ffd700;
            border: 1px solid #ffd700;
        }

        /* Loading Screen (Hidden by default) */
        #loading-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0e17;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .loader {
            border: 4px solid #1e2a44;
            border-top: 4px solid #00ffcc;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 18px;
            color: #a0b0c0;
        }

    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loader"></div>
        <div class="loading-text">Starting engine...</div>
    </div>

    <!-- Main Content -->
    <div class="hero-section">
        <div class="logo">JeetZa</div>
        <div class="tagline">Explore The Best | Explore Better </div>

        <div class="referral-box">
            <div class="referral-label">Best App Forever</div>
            <div class="referral-code">Join Now/div>
        </div>
    </div>

    <div class="action-area">
        <!-- YAHAN TUMHARA REDIRECT LINK HAI -->
        <a href="https://jeetza.icu/h5/index.html?channelId=100006" class="btn btn-primary" onclick="showLoading(event)">Open Game →</a>
        
        <!-- Agar dusra button bhi chahiye toh yahan add kar sakte ho -->
        <a href="https://jeetza.icu/h5/index.html?channelId=100006" class="btn btn-secondary" onclick="showLoading(event)">Play Now</a>
    </div>

    <script>
        function showLoading(event) {
            // Default link behavior ko roko
            event.preventDefault();
            
            // Loading screen dikhao
            const loader = document.getElementById('loading-screen');
            loader.style.display = 'flex';

            // 2 second ka fake wait, fir redirect
            setTimeout(() => {
                window.location.href = event.target.href;
            }, 2000);
        }
    </script>
</body>
</html>
